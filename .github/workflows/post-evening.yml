name: Post Evening (Archive Throwback)

# Posts a random older entry from the archive to all 3 platforms.
#
# 2026-07-25: daily cron DISABLED. Buffer publish cadence was cut to 1 slot/day
# per channel on 2026-07-23, but supply stayed at 2-3 posts/day, so the queue
# backlog grew ~1-2 posts/day/channel and content was publishing 2+ days stale.
# Supply now matches drain: X gets the morning static, FB+IG get the daily reel.
# Fire manually via workflow_dispatch for one-off throwbacks.

on:
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Set up Node 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Post to Buffer (evening)
        working-directory: scripts
        env:
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BUFFER_PROFILE_IDS: ${{ secrets.BUFFER_PROFILE_IDS }}
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
          POST_MODE: evening
        run: node post-to-buffer.js
