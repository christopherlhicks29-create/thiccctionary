name: From the Boat (Bertram, irregular)

# Wave 213: Bertram Whitmore writes from the Margaret IV, somewhere at sea.
# Twice a month. Cron 1st and 15th at 14:00 UTC, plus admin sentinel.

on:
  schedule:
    - cron: '0 14 1 * *'
    - cron: '0 14 15 * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/.fire-from-the-boat'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Generate dispatch
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/generate-from-the-boat.js
      - name: Regenerate article listings
        run: node scripts/regenerate-article-listings.js
      - name: Normalize article <head> blocks (Wave 303)
        run: node scripts/normalize-article-heads.js
        continue-on-error: true
      - name: Build category pages (Wave 304b)
        run: node scripts/build-category-pages.js
        continue-on-error: true
      - name: Sync sitemap (Wave 303)
        run: node scripts/sync-sitemap.js
        continue-on-error: true
      - name: Fix heading hierarchy (Wave 304)
        run: node scripts/fix-heading-hierarchy.js
        continue-on-error: true
      - name: Sync footer links (Wave 304b)
        run: node scripts/sync-footer-links.js
        continue-on-error: true
      - name: Sync WebP derivatives (Wave 305)
        run: node scripts/sync-webp.js
        continue-on-error: true

      - name: Commit + push
        run: |
          git config user.email "actions@github.com"
          git config user.name "Bertram (auto)"
          # Wave 304b: the post-generation reconcilers (headings, footer links,
          # category hubs) touch pages outside articles/, so a narrow add left
          # their work unstaged and silently discarded. Checkout is clean here.
          git add -A 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "From the Boat (auto) $(date -u +%Y-%m-%d)"
            git pull --rebase origin main || true
            git push origin main
          fi
      - name: Cleanup fire sentinel
        if: github.event_name == 'push'
        run: |
          if [ -f data/.fire-from-the-boat ]; then
            rm data/.fire-from-the-boat
            git add data/.fire-from-the-boat
            git commit -m "Cleanup from-the-boat sentinel"
            git pull --rebase origin main || true
            git push origin main || true
          fi
