name: From the Boat (Bertram, irregular)

# Wave 213: Bertram Whitmore writes from the Margaret IV, somewhere at sea.
# Twice a month. Cron 1st and 15th at 14:00 UTC, plus admin sentinel.

on:
  schedule:
    - cron: '0 14 1 * *'
    - cron: '0 14 15 * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/.fire-from-the-boat'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Generate dispatch
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/generate-from-the-boat.js
      - name: Reconciler prerequisites (Wave 320)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq webp
          pip install pillow --quiet --break-system-packages || pip install pillow --quiet

      # Wave 320: the reconciler chain lives in scripts/reconcile.js, once.
      # It used to be seventeen YAML steps repeated in four workflows and
      # missing from a fifth, which is how a renamed photograph shipped a
      # category hub pointing at a file that no longer existed.
      - name: Reconcile the whole site (Wave 320)
        run: node scripts/reconcile.js
        continue-on-error: true

      - name: Commit + push
        run: |
          git config user.email "actions@github.com"
          git config user.name "Bertram (auto)"
          # Wave 304b: the post-generation reconcilers (headings, footer links,
          # category hubs) touch pages outside articles/, so a narrow add left
          # their work unstaged and silently discarded. Checkout is clean here.
          git add -A 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "From the Boat (auto) $(date -u +%Y-%m-%d)"
            git pull --rebase origin main || true
            git push origin main
          fi
      - name: Cleanup fire sentinel
        if: github.event_name == 'push'
        run: |
          if [ -f data/.fire-from-the-boat ]; then
            rm data/.fire-from-the-boat
            git add data/.fire-from-the-boat
            git commit -m "Cleanup from-the-boat sentinel"
            git pull --rebase origin main || true
            git push origin main || true
          fi
