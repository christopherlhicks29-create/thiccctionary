name: Mailbag (Bartholomew, weekly)

# Wave 210: Wednesday Mailbag. Bart answers fake reader letters spanning
# thiccc taxonomy, office matters, and geopolitics. Cron Wednesdays at
# 16:00 UTC. Also fireable via admin sentinel data/.fire-mailbag.

on:
  schedule:
    - cron: '0 16 * * 3'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/.fire-mailbag'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Generate Mailbag
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/generate-mailbag.js

      - name: Regenerate article listings
        run: node scripts/regenerate-article-listings.js
      - name: Normalize article <head> blocks (Wave 303)
        run: node scripts/normalize-article-heads.js
        continue-on-error: true
      - name: Build category pages (Wave 304b)
        run: node scripts/build-category-pages.js
        continue-on-error: true
      - name: Sync sitemap (Wave 303)
        run: node scripts/sync-sitemap.js
        continue-on-error: true
      - name: Fix heading hierarchy (Wave 304)
        run: node scripts/fix-heading-hierarchy.js
        continue-on-error: true
      - name: Sync footer links (Wave 304b)
        run: node scripts/sync-footer-links.js
        continue-on-error: true
      - name: Reconcile plate numbers (Wave 314)
        run: node scripts/sync-plate-numbers.js
        continue-on-error: true
      - name: Point articles at their own OG cards (Wave 314)
        run: node scripts/sync-article-og.js
        continue-on-error: true
      - name: Complete share cards (Wave 316)
        run: node scripts/sync-social-cards.js
        continue-on-error: true
      - name: Reconcile og:image dimensions (Wave 311b)
        run: node scripts/sync-og-dimensions.js
        continue-on-error: true
      - name: Sync WebP derivatives (Wave 305)
        run: node scripts/sync-webp.js
        continue-on-error: true

      - name: Commit + push
        run: |
          git config user.email "actions@github.com"
          git config user.name "Bartholomew (auto)"
          # Wave 304b: the post-generation reconcilers (headings, footer links,
          # category hubs) touch pages outside articles/, so a narrow add left
          # their work unstaged and silently discarded. Checkout is clean here.
          git add -A 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "Mailbag Vol. (auto) $(date -u +%Y-%m-%d)"
            git pull --rebase origin main || true
            git push origin main
          fi

      - name: Cleanup fire sentinel
        if: github.event_name == 'push'
        run: |
          if [ -f data/.fire-mailbag ]; then
            rm data/.fire-mailbag
            git add data/.fire-mailbag
            git commit -m "Cleanup mailbag sentinel"
            git pull --rebase origin main || true
            git push origin main || true
          fi
