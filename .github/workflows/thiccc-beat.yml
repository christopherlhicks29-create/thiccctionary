name: Thiccc Beat (render staged drafts)

# Renders every drafts/thiccc-beat/*.md to a live article page.
# Deterministic and idempotent (no API key). Manual dispatch or new-draft push.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/.fire-thiccc-beat'
      - 'drafts/thiccc-beat/**'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Render Thiccc Beat drafts
        run: node scripts/generate-thiccc-beat.js
      # Wave 285b: the renderer points og:image at articles/og/<slug>.png but
      # never built the card - every new Beat shipped with a broken OG image
      # until a manual build-article-og-images.py run caught up (same class as
      # Wave 246/281). Build it in the same run that creates the article.
      - name: Build OG cards for new articles
        run: |
          pip install pillow --quiet
          python3 scripts/build-article-og-images.py
      - name: Regenerate article listings
        run: node scripts/regenerate-article-listings.js
      - name: Normalize article <head> blocks (Wave 303)
        run: node scripts/normalize-article-heads.js
        continue-on-error: true
      - name: Build category pages (Wave 304b)
        run: node scripts/build-category-pages.js
        continue-on-error: true
      - name: Sync sitemap (Wave 303)
        run: node scripts/sync-sitemap.js
        continue-on-error: true
      - name: Fix heading hierarchy (Wave 304)
        run: node scripts/fix-heading-hierarchy.js
        continue-on-error: true
      - name: Sync footer links (Wave 304b)
        run: node scripts/sync-footer-links.js
        continue-on-error: true
      - name: Reconcile plate numbers (Wave 314)
        run: node scripts/sync-plate-numbers.js
        continue-on-error: true
      - name: Point articles at their own OG cards (Wave 314)
        run: node scripts/sync-article-og.js
        continue-on-error: true
      - name: Complete share cards (Wave 316)
        run: node scripts/sync-social-cards.js
        continue-on-error: true
      - name: Reconcile og:image dimensions (Wave 311b)
        run: node scripts/sync-og-dimensions.js
        continue-on-error: true
      - name: Sync WebP derivatives (Wave 305)
        run: node scripts/sync-webp.js
        continue-on-error: true
      - name: Commit and push
        run: |
          git config user.email "actions@github.com"
          git config user.name "Thiccc Beat (auto)"
          # Wave 304b: the post-generation reconcilers (headings, footer links,
          # category hubs) touch pages outside articles/, so a narrow add left
          # their work unstaged and silently discarded. Checkout is clean here.
          git add -A 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "Thiccc Beat (auto) $(date -u +%Y-%m-%d)"
            git pull --rebase origin main || true
            git push origin main
          fi
      - name: Cleanup fire sentinel
        if: github.event_name == 'push'
        run: |
          if [ -f data/.fire-thiccc-beat ]; then
            rm data/.fire-thiccc-beat
            git add data/.fire-thiccc-beat
            git commit -m "Cleanup thiccc-beat sentinel"
            git pull --rebase origin main || true
            git push origin main || true
          fi
