name: Thiccc Beat (render staged drafts)

# Renders every drafts/thiccc-beat/*.md to a live article page.
# Deterministic and idempotent (no API key). Manual dispatch or new-draft push.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/.fire-thiccc-beat'
      - 'drafts/thiccc-beat/**'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Render Thiccc Beat drafts
        run: node scripts/generate-thiccc-beat.js
      # Wave 285b: the renderer points og:image at articles/og/<slug>.png but
      # never built the card - every new Beat shipped with a broken OG image
      # until a manual build-article-og-images.py run caught up (same class as
      # Wave 246/281). Build it in the same run that creates the article.
      - name: Build OG cards for new articles
        run: |
          pip install pillow --quiet
          python3 scripts/build-article-og-images.py
      - name: Reconciler prerequisites (Wave 320)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq webp
          pip install pillow --quiet --break-system-packages || pip install pillow --quiet

      # Wave 320: the reconciler chain lives in scripts/reconcile.js, once.
      # It used to be seventeen YAML steps repeated in four workflows and
      # missing from a fifth, which is how a renamed photograph shipped a
      # category hub pointing at a file that no longer existed.
      - name: Reconcile the whole site (Wave 320)
        run: node scripts/reconcile.js
        continue-on-error: true

      - name: Commit and push
        run: |
          git config user.email "actions@github.com"
          git config user.name "Thiccc Beat (auto)"
          # Wave 304b: the post-generation reconcilers (headings, footer links,
          # category hubs) touch pages outside articles/, so a narrow add left
          # their work unstaged and silently discarded. Checkout is clean here.
          git add -A 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "Thiccc Beat (auto) $(date -u +%Y-%m-%d)"
            git pull --rebase origin main || true
            git push origin main
          fi
      - name: Cleanup fire sentinel
        if: github.event_name == 'push'
        run: |
          if [ -f data/.fire-thiccc-beat ]; then
            rm data/.fire-thiccc-beat
            git add data/.fire-thiccc-beat
            git commit -m "Cleanup thiccc-beat sentinel"
            git pull --rebase origin main || true
            git push origin main || true
          fi
